name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask requests tzdata
      - run: python -m unittest discover -s tests -v
      - name: Check dashboard and overlay JavaScript
        run: python tests/check_html_js.py

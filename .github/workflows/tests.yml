name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask requests tzdata
      - name: Compile app and GPU worker
        run: python -m py_compile app.py speech_engine.py kokoro_worker.py
      - name: Run test suite
        run: python -m unittest discover -s tests -v

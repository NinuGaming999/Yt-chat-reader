name: Build Windows desktop installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop and neural speech dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install onnxruntime-directml==1.24.4
          python -m pip install --no-deps kokoro-onnx==0.6.1
      - name: Download and verify Kokoro models
        shell: pwsh
        run: ./download_models.ps1
      - name: Smoke-test Kokoro neural streaming on CPU
        run: python smoke_neural.py
      - name: Build desktop application
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name NinuGamingLiveAssistant
          --add-data "ui.html;."
          --add-data "obs.html;."
          --collect-all webview
          --collect-all kokoro_onnx
          --collect-all onnxruntime
          --collect-all phonemizer
          --collect-all espeakng_loader
          --collect-all sounddevice
          --copy-metadata kokoro-onnx
          app.py
      - name: Download Microsoft WebView2 Evergreen bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_assets | Out-Null
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile 'installer_assets/vc_redist.x64.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'installer_assets/MicrosoftEdgeWebView2Setup.exe'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe','C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler ISCC.exe was not found.' }
          & $compiler.FullName /Qp setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'installer/NinuGamingLiveAssistant-Setup.exe')) { throw 'Installer output was not created.' }
      - uses: actions/upload-artifact@v4
        with:
          name: NinuGamingLiveAssistant-Setup
          path: installer/NinuGamingLiveAssistant-Setup.exe
          retention-days: 30
      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Publish GitHub Release with Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NinuGaming Live Assistant v${{ steps.ver.outputs.version }}
          body: |
            ## NinuGaming Live Assistant v${{ steps.ver.outputs.version }}

            ### What's new in 2.2
            - **Smarter chat reading:** links, emoji and `:emoji:` codes are cleaned up, repeated letters and ALL-CAPS are tamed, UIDs are read digit by digit, usernames are tidied, and a pronunciation list is supported.
            - **Priority speech queue:** Super Chats and memberships first, then review requests, then mods/members, then normal chat. Old chat is dropped when the queue gets crowded so the voice never falls minutes behind.
            - **Filters:** viewer cooldown, duplicate and copy-paste spam detection, blocked words and viewers, bot-command ignore, and skipping non-English scripts the English voice cannot pronounce.
            - **Review queue:** UID validation and region, duplicate-UID warning, reorder / edit / Done, finished-review history and CSV export.
            - **OBS:** separate queue, chat and "now speaking" overlays with themes, size, colour and animations; lightweight overlay endpoint; fixed an HTML typo.
            - **Reliability:** quota and runtime warnings, optional backup API key, auto-reconnect when a stream drops, update check.
            - **Security and control:** API keys encrypted with Windows DPAPI, optional global hotkeys, stream profiles, session insights and exports.
            - **Interface:** tabs for Live / Review queue / Insights / Tools.
            - The Kokoro neural voice engine is unchanged.

            ### Installation
            Download NinuGamingLiveAssistant-Setup.exe, run it, and follow the installer.
          files: installer/NinuGamingLiveAssistant-Setup.exe
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true

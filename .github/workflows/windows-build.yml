name: Build Windows desktop installer
on:
  push:
    branches: [main, feature/vibevoice-cuda]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile app and GPU worker
        run: python -m py_compile app.py speech_engine.py kokoro_worker.py
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Build lightweight desktop application
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name NinuGamingLiveAssistant
          --icon "app.ico"
          --add-data "app.ico;."
          --add-data "ui.html;."
          --add-data "obs.html;."
          --add-data "kokoro_worker.py;."
          --collect-all webview
          app.py
      - name: Download Microsoft WebView2 and Visual C++ bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_assets | Out-Null
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile 'installer_assets/vc_redist.x64.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'installer_assets/MicrosoftEdgeWebView2Setup.exe'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe','C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler ISCC.exe was not found.' }
          & $compiler.FullName /Qp setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'installer/NinuGamingLiveAssistant-Setup.exe')) { throw 'Installer output was not created.' }
      - uses: actions/upload-artifact@v4
        with:
          name: NinuGamingLiveAssistant-Setup
          path: installer/NinuGamingLiveAssistant-Setup.exe
          retention-days: 30
      - name: Publish Kokoro PyTorch CUDA release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/vibevoice-cuda' && startsWith(github.event.head_commit.message, 'Publish release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0-rc.2
          target_commitish: feature/vibevoice-cuda
          name: NinuGaming Live Assistant v2.3.0-rc.2
          body: |
            ## NinuGaming Live Assistant v2.3.0 Release Candidate 2

            This release candidate replaces the failing strict ONNX CUDA graph session with the native Kokoro-v1.0 PyTorch model on NVIDIA CUDA.

            ### GPU-only model inference
            - Installs PyTorch 2.11.0 from the official CUDA 12.8 Windows wheel index.
            - Runs the original Kokoro-82M v1.0 model with its parameters and buffers on cuda:0.
            - Refuses to start when a CUDA-enabled PyTorch runtime or NVIDIA GPU is unavailable.
            - No CPU model-inference fallback is implemented.
            - Text normalization, phonemization, and final audio playback remain CPU-side desktop I/O.

            ### Included
            - Lightweight Windows x64 desktop installer with the full red app icon.
            - 27 selected American and British English Kokoro voices.
            - Streaming sentence audio, speed/volume controls, and GPU warm-up validation.
            - Short-chat batching and TTS cleanup while retaining original messages in the UI.
            - Existing YouTube chat inbox, Genshin UID detection/review queue, and OBS overlay.

            ### Before installing
            - Requires a supported NVIDIA GPU, current compatible NVIDIA driver, internet access, and several GB of free disk space.
            - First launch installs PyTorch CUDA and Kokoro in a separate runtime, then downloads model weights and selected voices from Hugging Face.
            - Speech synthesis uses GPU resources and may compete with a running game.
            - CI can validate packaging and code tests but cannot prove local RTX 3060 audio playback.
            - This is a release candidate, not a stable release.
          files: installer/NinuGamingLiveAssistant-Setup.exe
          draft: false
          prerelease: true
          overwrite_files: true
          make_latest: false

name: Build Windows desktop installer
on:
  push:
    branches: [main, feature/vibevoice-cuda]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile app and GPU worker
        run: python -m py_compile app.py speech_engine.py kokoro_worker.py
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Build lightweight desktop application
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name NinuGamingLiveAssistant
          --icon "app.ico"
          --add-data "app.ico;."
          --add-data "ui.html;."
          --add-data "obs.html;."
          --add-data "kokoro_worker.py;."
          --collect-all webview
          app.py
      - name: Download Microsoft WebView2 and Visual C++ bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_assets | Out-Null
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile 'installer_assets/vc_redist.x64.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'installer_assets/MicrosoftEdgeWebView2Setup.exe'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe','C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler ISCC.exe was not found.' }
          & $compiler.FullName /Qp setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'installer/NinuGamingLiveAssistant-Setup.exe')) { throw 'Installer output was not created.' }
      - uses: actions/upload-artifact@v4
        with:
          name: NinuGamingLiveAssistant-Setup
          path: installer/NinuGamingLiveAssistant-Setup.exe
          retention-days: 30
      - name: Publish Kokoro CUDA release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/vibevoice-cuda' && startsWith(github.event.head_commit.message, 'Publish release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0-rc.1
          target_commitish: feature/vibevoice-cuda
          name: NinuGaming Live Assistant v2.3.0-rc.1
          body: |
            ## NinuGaming Live Assistant v2.3.0 Release Candidate 1

            This release candidate switches speech synthesis to Kokoro-82M v1.0 FP16 ONNX through NVIDIA ONNX Runtime CUDA.

            ### Included
            - Windows x64 desktop installer with the full red app icon.
            - 27 selected American and British English Kokoro voice presets.
            - NVIDIA CUDAExecutionProvider with ONNX Runtime CPU node fallback explicitly disabled.
            - Streaming sentence/clause audio with voice speed and volume controls.
            - Short-chat batching and TTS cleanup for emoji/symbol noise and unsupported scripts.
            - SHA-256 verified Kokoro FP16 model and voice pack downloads.
            - Separate lightweight first-run speech runtime; no PyTorch/VibeVoice installation.

            ### Before installing
            - Requires a supported NVIDIA GPU and compatible current NVIDIA driver.
            - First launch installs ONNX Runtime GPU/CUDA/cuDNN and downloads about 190 MB of model and voice data.
            - Speech synthesis uses GPU resources and may compete with a game.
            - Actual CUDA audio playback still needs testing on the installer's PC.
            - This is a release candidate, not a stable release.
          files: installer/NinuGamingLiveAssistant-Setup.exe
          draft: false
          prerelease: true
          overwrite_files: true
          make_latest: false

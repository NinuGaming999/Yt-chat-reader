<!doctype html><nhtml lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NinuGaming Live Assistant Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#f5f7ff;font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}.wrap{padding:18px}.panel{max-width:1120px;margin:auto;border:1px solid #ffffff24;border-radius:22px;background:linear-gradient(135deg,#080d17e8,#151d30df);backdrop-filter:blur(14px);box-shadow:0 20px 60px #0008;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #ffffff16}.title{font-size:20px;font-weight:950;letter-spacing:-.03em}.subtitle{font-size:11px;color:#aab8ce;margin-top:3px}.live{font-size:10px;letter-spacing:.12em;color:#76e6b6;font-weight:900}.section{padding:13px 18px}.section h2{font-size:12px;color:#9caec7;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}.speech{border:1px solid #2b7e87;background:#102b37;padding:12px 14px;border-radius:13px}.speech .name{font-size:11px;color:#79dde2;font-weight:900}.speech .text{font-size:15px;font-weight:750;margin-top:4px;overflow-wrap:anywhere}.rows{display:flex;flex-direction:column;gap:7px}.row{display:grid;grid-template-columns:34px 1fr 120px;gap:10px;align-items:center;padding:9px 10px;border:1px solid #ffffff13;background:#ffffff08;border-radius:10px}.rank{color:#b7a5ff;font-size:16px;font-weight:950}.name{font-weight:850;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.uid{font-size:10px;color:#75dbe7;font-family:Consolas,monospace}.request{grid-column:2/4;color:#b9c6d9;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{font-size:11px;color:#8b9bb1;text-align:center;padding:18px}.foot{display:flex;justify-content:space-between;color:#7c8ca3;padding:10px 19px;font-size:9px;border-top:1px solid #ffffff13}
</style></head><body><div class="wrap"><div class="panel"><div class="head"><div><div class="title">NinuGaming · Live Assistant</div><div class="subtitle">Live Genshin review queue</div></div><div class="live" id="status">WAITING</div></div><div class="section"><h2>Currently reading</h2><div class="speech" id="speech"><div class="name">Voice assistant</div><div class="text">Waiting for chat…</div></div></div><div class="section"><h2>Next viewers · <span id="count">0</span></h2><div class="rows" id="rows"><div class="empty">No one is waiting yet.</div></div></div><div class="foot"><span>Managed by NinuGaming Live Assistant</span><span id="sync">Connecting…</span></div></div></div>
<script>
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(s){const d=new Date(s);return isNaN(d)?'':d.toLocaleTimeString()}
async function load(){try{const r=await fetch('/api/state');const d=await r.json();$('status').textContent=d.connected?'LIVE':d.running?'CONNECTING':'OFFLINE';const c=d.currently_speaking;$('speech').innerHTML=c?`<div class="name">${esc(c.name)}</div><div class="text">${esc(c.text)}</div>`:`<div class="name">Voice assistant</div><div class="text">${d.speech_paused?'Speech paused':'Waiting for chat…'}</div>`;const q=d.review_queue||[];$('count').textContent=q.length;$('rows').innerHTML=q.length?q.slice(0,5).map((x,i)=>`<div class="row"><div class="rank">${i+1}</div><div class="name">${esc(x.name||'Viewer')}</div><div class="uid">${esc(x.uid||'not given')}</div><div class="request">${esc(x.full_comment||x.request||'Account review')}</div></div>`).join(''):'<div class="empty">No one is waiting yet.</div>';$('sync').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){$('status').textContent='APP OFFLINE'}}load();setInterval(load,1000);
</script></body></html>
